name: BIOS CD candidate keyboard-01
on:
  pull_request:
    paths:
      - 'audit/public-live-cd/candidates/keyboard-01/**'
      - 'audit/public-live-cd/check*.py'
      - 'audit/public-live-cd/compare_*.py'
      - '.github/workflows/bios-cd-candidate.yml'
      - 'PCP-OS.iso'
permissions:
  contents: read
jobs:
  optical:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      CANDIDATE: audit/public-live-cd/candidates/keyboard-01
      RUSTUP_TOOLCHAIN: 1.100.0
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Read the merged keyboard fixes
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KirtusJ/pcp-os
          ref: 946ef854d908c9beb37436cf3f37284a2ad86610
          path: os-source
          persist-credentials: false
      - name: Install build and observation tools
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends qemu-system-x86 seabios xorriso lld binutils tesseract-ocr tesseract-ocr-eng
          mkdir -p "$RUNNER_TEMP/optical"
          qemu-system-x86_64 --version > "$RUNNER_TEMP/optical/qemu.txt"
          xorriso -version > "$RUNNER_TEMP/optical/xorriso.txt"
      - name: Prepare and independently inspect the CD
        id: prepare
        run: |
          out="$RUNNER_TEMP/optical"
          rustup toolchain install 1.100.0 --profile minimal --component rust-src
          rustc -vV > "$out/rust.txt"
          bash os-source/PCP_OS_Rust/crates/pcpos-kernel/run.sh build
          python3 "$CANDIDATE/candidate.py" inspect PCP-OS.iso os-source "$out"
          cmp os-source/PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32 "$out/kernel.elf32"
      - name: Cold boot, playback, keyboard Stop, returns and shutdown on the wall clock
        if: "!cancelled() && steps.prepare.outcome == 'success'"
        run: python3 "$CANDIDATE/candidate.py" wall PCP-OS.iso os-source "$RUNNER_TEMP/optical"
      - name: Cold boot, playback, keyboard Stop, returns and shutdown with instruction counting
        if: "!cancelled() && steps.prepare.outcome == 'success'"
        run: python3 "$CANDIDATE/candidate.py" instructions PCP-OS.iso os-source "$RUNNER_TEMP/optical"
      - name: Assemble the same BIOS CD in two fresh directories and boot the result
        if: "!cancelled() && steps.prepare.outcome == 'success'"
        run: |
          root="$RUNNER_TEMP/optical/rebuilt"
          elf=os-source/PCP_OS_Rust/crates/pcpos-kernel/target/pcpos-kernel.elf32
          mkdir -p "$root"
          touch -d '2017-01-02T03:04:05Z' "$elf"
          (umask 022; unset SOURCE_DATE_EPOCH; TZ=Pacific/Honolulu python3 "$CANDIDATE/candidate.py" build PCP-OS.iso os-source "$root/first")
          touch -d '2024-06-07T08:09:10Z' "$elf"
          epoch=$(git -C os-source show -s --format=%ct HEAD)
          (umask 077; TZ=Asia/Tokyo SOURCE_DATE_EPOCH="$epoch" python3 "$CANDIDATE/candidate.py" build PCP-OS.iso os-source "$root/second")
          for file in candidate.iso kernel.elf32 keyboard-01.zip identity.json; do
            cmp "$root/first/$file" "$root/second/$file"
          done
          (cd "$root" && sha256sum {first,second}/{candidate.iso,kernel.elf32,keyboard-01.zip,identity.json}) > "$root/checksums.txt"
          python3 "$CANDIDATE/candidate.py" instructions PCP-OS.iso os-source "$root/first"
      - name: Compare both optical images under the same competing CPU load
        if: "!cancelled() && steps.prepare.outcome == 'success'"
        run: |
          python3 audit/public-live-cd/compare_contention.py PCP-OS.iso "$RUNNER_TEMP/optical/contention" \
            --candidate "$RUNNER_TEMP/optical/candidate.iso"
      - name: Preserve both trials and the optical identities
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: keyboard-01-observations
          path: ${{ runner.temp }}/optical
          if-no-files-found: error
  rollback:
    runs-on: ubuntu-24.04
    timeout-minutes: 16
    steps:
      - name: Read the guide and acceptance tools without checking out either image
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /audit/public-live-cd/check.py
            /audit/public-live-cd/candidates/keyboard-01/check_rollback.py
            /audit/public-live-cd/candidates/keyboard-01/restore.md
            /audit/public-live-cd/candidates/keyboard-01/identity.json
      - name: Install the emulator and framebuffer reader
        run: |
          sudo apt-get -qq update
          sudo apt-get -qq install -y --no-install-recommends qemu-system-x86 seabios tesseract-ocr tesseract-ocr-eng
      - name: Try the downloaded candidate and recover the preceding public CD
        run: |
          test ! -e PCP-OS.iso
          test ! -e audit/public-live-cd/candidates/keyboard-01/keyboard-01.zip
          python3 audit/public-live-cd/candidates/keyboard-01/check_rollback.py "$RUNNER_TEMP/rollback"
      - name: Preserve the fetched media, serials, framebuffers and outcomes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-bios-cd-rollback
          path: ${{ runner.temp }}/rollback
          if-no-files-found: error
