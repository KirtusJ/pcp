name: Desktop host optical boot
on:
  pull_request:
    paths:
      - 'PCP-OS.iso'
      - 'audit/public-live-cd/candidates/source-bios/source-bios-tester.zip'
      - 'audit/public-live-cd/candidates/source-bios/verify.py'
      - 'audit/public-live-cd/candidates/keyboard-01-limine-10/keyboard-01-limine-10.zip'
      - 'audit/public-live-cd/check.py'
      - 'audit/public-live-cd/check_host_boot.py'
      - '.github/workflows/desktop-host-optical.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  boot:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025, macos-15, ubuntu-24.04]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      SOURCE_ISO: f904f393c9332c32ea5de8d73c5d81762717c6c31166708d6ce9ffdaa63e6f96
      SOURCE_KERNEL: 4732843ca93272f5b553a0ba7a6fb89a96f4672044edc686d4518567651e5bf4
      COMBINED_ZIP: audit/public-live-cd/candidates/keyboard-01-limine-10/keyboard-01-limine-10.zip
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - name: Install QEMU and SeaBIOS on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get -qq update && sudo apt-get -qq install -y --no-install-recommends qemu-system-x86 seabios
      - name: Install QEMU on macOS
        if: runner.os == 'macOS'
        run: brew list --versions qemu >/dev/null || brew install qemu
      - name: Install native Windows QEMU
        if: runner.os == 'Windows'
        id: msys
        uses: msys2/setup-msys2@ec48f7c5447b3140e2b088413ae3a55687bccb6e
        with:
          msystem: UCRT64
          update: true
          cache: false
          install: mingw-w64-ucrt-x86_64-qemu
      - name: Boot the CD on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $python = (Get-Command python.exe).Source
          $bin = Join-Path $env:MSYS_ROOT 'ucrt64/bin'
          $env:PATH = "$bin;$env:PATH"
          & $python audit/public-live-cd/check_host_boot.py PCP-OS.iso host-boot --qemu "$bin/qemu-system-x86_64.exe"
      - name: Boot the CD on macOS
        if: runner.os == 'macOS'
        run: python3 audit/public-live-cd/check_host_boot.py PCP-OS.iso host-boot
      - name: Boot the opt-in CD on the Windows host's ordinary clock
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: |
          $python = (Get-Command python.exe).Source
          $bin = Join-Path $env:MSYS_ROOT 'ucrt64/bin'
          $env:PATH = "$bin;$env:PATH"
          & $python audit/public-live-cd/check_host_boot.py $env:COMBINED_ZIP combined-boot --combined-zip --qemu "$bin/qemu-system-x86_64.exe"
      - name: Boot the opt-in CD on the macOS host's ordinary clock
        if: runner.os == 'macOS'
        run: python3 audit/public-live-cd/check_host_boot.py "$COMBINED_ZIP" combined-boot --combined-zip
      - name: Add the Windows emulator to the path
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MSYS_ROOT: ${{ steps.msys.outputs.msys2-location }}
        run: (Join-Path $env:MSYS_ROOT 'ucrt64/bin') | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
      - name: Verify the packaged source CD and boot the extracted image
        shell: bash
        run: |
          python audit/public-live-cd/candidates/source-bios/verify.py source-test.iso
          python audit/public-live-cd/check_host_boot.py source-test.iso source-boot --source-build \
            "$SOURCE_ISO" \
            "$SOURCE_KERNEL"
      - name: Read the pinned disposable-disk checker
        if: runner.os == 'Linux'
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KirtusJ/pcp-os
          ref: 7e99b59c2d6c2af50e32459d92468ae730fbec2c
          path: disk-check
          sparse-checkout: examples/optical-disk-check
          persist-credentials: false
      - name: Check four disposable disks and their write controls
        if: runner.os == 'Linux'
        shell: bash
        run: |
          checker=disk-check/examples/optical-disk-check/check.py
          mkdir source-disks
          flags=(--kernel "$SOURCE_KERNEL" --sha256 "$SOURCE_ISO" --tester-profile --timeout 65)
          python3 -IB "$checker" source-test.iso source-disks/ide "${flags[@]}"
          for sector in 512 4096; do
            python3 -IB "$checker" source-test.iso "source-disks/nvme-$sector" "${flags[@]}" --nvme-sector-size "$sector"
          done
      - name: Keep disposable-disk counters, serial logs and screens
        if: always() && runner.os == 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-optical-disks
          path: source-disks/
          if-no-files-found: warn
          retention-days: 30
      - name: Keep the source CD observations
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: source-optical-boot-${{ matrix.os }}
          path: source-boot/
          if-no-files-found: warn
          retention-days: 30
      - name: Keep the opt-in CD observations
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: combined-optical-boot-${{ matrix.os }}
          path: combined-boot/
          if-no-files-found: warn
          retention-days: 14
      - name: Keep serial, launcher, host version and shutdown evidence
        if: always() && runner.os != 'Linux'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: optical-boot-${{ matrix.os }}
          path: host-boot/
          if-no-files-found: warn
          retention-days: 14
