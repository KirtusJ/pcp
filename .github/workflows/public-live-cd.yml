name: Public live CD
on:
  pull_request:
    paths:
      - 'PCP-OS.iso'
      - 'audit/public-live-cd/**'
      - '.github/workflows/public-live-cd.yml'
permissions:
  contents: read
jobs:
  optical-boot:
    runs-on: ubuntu-24.04
    timeout-minutes: 24
    steps:
      - uses: actions/checkout@v4
      - name: Install emulator and framebuffer reader
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends qemu-system-x86 seabios tesseract-ocr tesseract-ocr-eng xorriso
      - name: Read the PCP OS Surfbird media verifier
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          repository: KirtusJ/pcp-os
          ref: 946ef854d908c9beb37436cf3f37284a2ad86610
          path: waveform-verifier
          sparse-checkout: apps/surfbird/guest
          persist-credentials: false
      - name: Boot the released CD and exercise its keyboard controls
        run: python3 audit/public-live-cd/check.py PCP-OS.iso "$RUNNER_TEMP/pcp-optical" --capture-audio --capture-video
      - name: Check the bundled track and the captured AC'97 output
        run: |
          python3 audit/public-live-cd/check_audio.py PCP-OS.iso "$RUNNER_TEMP/pcp-optical" \
            waveform-verifier/apps/surfbird/guest/replay_local_media.py
      - name: Compare four playback framebuffers with the pictures on the released CD
        run: |
          python3 audit/public-live-cd/check_video.py PCP-OS.iso "$RUNNER_TEMP/pcp-optical" \
            waveform-verifier/apps/surfbird/guest/replay_local_media.py
      - name: Compare cold-start clock modes
        if: success() || failure()
        run: python3 audit/public-live-cd/compare_clocks.py PCP-OS.iso "$RUNNER_TEMP/pcp-clocks"
      - name: Compare same-CPU contention on the wall clock
        if: success() || failure()
        run: python3 audit/public-live-cd/compare_contention.py PCP-OS.iso "$RUNNER_TEMP/pcp-contention"
      - name: Keep serial and framebuffer observations
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-cd-observations
          path: |
            ${{ runner.temp }}/pcp-optical/
            ${{ runner.temp }}/pcp-clocks/
            ${{ runner.temp }}/pcp-contention/
          if-no-files-found: warn
